[project]
name = "superhuman-go-backend"
version = "0.1.0"
description = "FastAPI service and authenticated MCP tools for the hackathon workspace"
requires-python = ">=3.11,<3.15"
dependencies = [
  "cryptography==50.0.2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=1.20,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]
ml = ["numpy>=2,<3", "onnxruntime>=1.20,<2"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackathon_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
