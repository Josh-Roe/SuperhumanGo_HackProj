name: Keep backend awake
# Render's free tier sleeps after ~15 idle minutes and takes 30-60s+ to wake,
# longer than the website's API timeouts. Ping it so the demo site stays usable.
# GitHub may delay scheduled runs by several minutes; this is best effort.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Stops pinging after the hackathon: end of 2026-10-17 Pacific (07:00 UTC 10-18).
      - name: Ping Render health check
        run: |
          if [ "${{ github.event_name }}" = schedule ] && [ "$(date -u +%s)" -ge "$(date -u -d 2026-10-18T07:00:00Z +%s)" ]; then
            echo "Keep-awake window ended; skipping."; exit 0
          fi
          curl -fsS --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors https://superhuman-go-event-backend.onrender.com/api/health
