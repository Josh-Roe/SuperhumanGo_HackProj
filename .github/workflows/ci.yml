name: Project checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            integrations/superhuman/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.11
      - run: uv sync --project backend --python 3.11 --frozen --extra dev
      - run: npm run setup
      - run: npm run check
      - name: Check Compose configuration
        run: docker compose config --quiet
        env:
          MCP_AUTH_TOKEN: ci-placeholder-not-a-secret
      - name: Build frontend image
        run: docker build -t hackathon-frontend ./frontend
      - name: Build backend image
        run: docker build -t hackathon-backend ./backend
      - name: Smoke test container stack
        env:
          MCP_AUTH_TOKEN: ci-placeholder-not-a-secret
        run: |
          docker compose up -d --build
          curl --retry 12 --retry-all-errors --retry-delay 2 --fail http://localhost/api/health
          curl --fail --output /dev/null http://localhost/
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=100
        env:
          MCP_AUTH_TOKEN: ci-placeholder-not-a-secret
      - name: Stop containers
        if: always()
        run: docker compose down
        env:
          MCP_AUTH_TOKEN: ci-placeholder-not-a-secret
