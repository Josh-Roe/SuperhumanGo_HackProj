name: Project checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Replay migrations in an isolated local Supabase stack
        run: |
          supabase start --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,mailpit
          supabase db reset --local --no-seed
      - name: Database ownership, revision, privacy and retry checks
        run: |
          for sql_test in supabase/tests/*.sql; do
            psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file "$sql_test"
          done
      - name: Stop test Supabase
        if: always()
        run: supabase stop
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            integrations/superhuman/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.11
      - run: uv sync --project backend --python 3.11 --frozen --extra dev
      - run: npm run setup
      - run: npm run check
      - name: Check Compose configuration
        run: docker compose config --quiet
        env:
          MCP_AUTH_TOKEN: ci-placeholder-not-a-secret
      - name: Build frontend image
        run: docker build -t hackathon-frontend ./frontend
      - name: Build backend image
        run: docker build -t hackathon-backend ./backend
      - name: Backend image honors Render's PORT
        env:
          MCP_AUTH_TOKEN: ci-placeholder-not-a-secret
        run: |
          docker run -d --name render-port -e PORT=10000 -e MCP_AUTH_TOKEN -e RENDER_EXTERNAL_HOSTNAME=localhost -p 10000:10000 hackathon-backend
          curl --retry 12 --retry-all-errors --retry-delay 2 --fail http://localhost:10000/api/health || { docker logs render-port; exit 1; }
          docker rm -f render-port
      - name: Smoke test container stack
        env:
          MCP_AUTH_TOKEN: ci-placeholder-not-a-secret
        run: |
          docker compose up -d --build
          curl --retry 12 --retry-all-errors --retry-delay 2 --fail http://localhost/api/health
          curl --fail --output /dev/null http://localhost/
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=100
        env:
          MCP_AUTH_TOKEN: ci-placeholder-not-a-secret
      - name: Stop containers
        if: always()
        run: docker compose down
        env:
          MCP_AUTH_TOKEN: ci-placeholder-not-a-secret
