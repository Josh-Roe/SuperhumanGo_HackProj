services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in the root .env file}
      ONNX_MODEL_PATH: ${ONNX_MODEL_PATH:-}
    volumes:
      - ./models:/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
  frontend:
    build: ./frontend
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
