# Optional native Python deployment. No Docker or new database required.
services:
  - type: web
    name: superhuman-go-event-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: uv sync --frozen --no-dev
    startCommand: .venv/bin/python -m hackathon_backend.api.serve
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: UV_VERSION
        value: 0.12.13
      # Defaults to RENDER_EXTERNAL_HOSTNAME when unset.
      - key: APP_DOMAIN
        sync: false
      - key: APP_URL
        sync: false
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # https://<host>/api/google/callback
      - key: GOOGLE_REDIRECT_URI
        sync: false
